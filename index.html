<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pravin X Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    Pravin X Panel
  </div>

  <div class="container">

    <div class="card">
      <h2>Welcome Pravin Bhoye 👋</h2>
      <p>तुमच्या Admin Panel मध्ये स्वागत आहे.</p>
    </div>

    <div class="card">
      <h3>Dashboard</h3>
      <button class="button">Users</button>
      <button class="button">Settings</button>
      <button class="button">Reports</button>
    </div>

  </div>

</body>
</html>
